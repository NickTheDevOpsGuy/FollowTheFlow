<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#f5f7fa" />

  <!-- Card behind pads -->
  <rect
    x="20"
    y="20"
    width="160"
    height="160"
    rx="32"
    fill="#ffffff"
    stroke="#e5e7eb"
  />

  <!-- Top-left pad -->
  <rect
    x="36"
    y="36"
    width="56"
    height="56"
    rx="18"
    fill="#ff4d4d"
  />

  <!-- Top-right pad -->
  <rect
    x="108"
    y="36"
    width="56"
    height="56"
    rx="18"
    fill="#4d94ff"
  />

  <!-- Bottom-left pad -->
  <rect
    x="36"
    y="108"
    width="56"
    height="56"
    rx="18"
    fill="#4dff4d"
  />

  <!-- Bottom-right pad -->
  <rect
    x="108"
    y="108"
    width="56"
    height="56"
    rx="18"
    fill="#ffff4d"
  />
</svg>